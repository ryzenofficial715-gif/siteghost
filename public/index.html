<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITEGHOST v2 — Web Ripper + WAF Bypass</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #111118;
            --border: #1e1e2a;
            --text: #e0e0e0;
            --dim: #6b6b80;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --red: #ff6b6b;
            --green: #00d2a0;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 40px 20px 30px;
        }
        .logo {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .subtitle {
            color: var(--dim);
            margin-top: 8px;
            font-size: 0.95em;
        }
        
        .search-box {
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border 0.3s;
        }
        .search-box:focus-within { border-color: var(--accent); }
        .search-box input {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.1em;
            padding: 14px 18px;
            outline: none;
            border-radius: 12px;
        }
        .search-box input:focus { border-color: var(--accent); }
        
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9em;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            flex: 1;
        }
        .btn-primary:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .spinner {
            display: none;
            width: 26px;
            height: 26px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .result {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .s-ok { background: rgba(0,210,160,0.15); color: var(--green); }
        .s-err { background: rgba(255,107,107,0.15); color: var(--red); }
        
        .tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            padding-bottom: 3px;
        }
        .tab {
            padding: 9px 14px;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            font-size: 0.8em;
            font-weight: 600;
            color: var(--dim);
            transition: all 0.2s;
            border: none;
            background: transparent;
            white-space: nowrap;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--accent2);
            border-bottom: 2px solid var(--accent2);
            background: rgba(0,206,201,0.05);
        }
        
        .code-block {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            max-height: 60vh;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.82em;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #a0a0b0;
        }
        .card-list { display: flex; flex-direction: column; gap: 8px; }
        .card-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.85em;
            word-break: break-all;
        }
        .card-item .label {
            font-size: 0.75em;
            color: var(--dim);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .danger { color: var(--red); font-weight: 600; }
        
        @media (max-width: 600px) {
            .logo { font-size: 1.8em; }
            .search-box { padding: 16px; }
            .btn { padding: 10px 14px; font-size: 0.78em; }
            .tab { padding: 7px 10px; font-size: 0.7em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🕸️ SITEGHOST v2</div>
            <p class="subtitle">Web Ripper + WAF/404 Bypass + Download Assets — SHADOWREAPER</p>
        </div>
        
        <div class="search-box">
            <input type="url" id="targetUrl" placeholder="Masukkan URL target... (contoh: https://target.com)" autocomplete="off">
            <div class="btn-row">
                <button class="btn btn-primary" id="btnRip" onclick="ripSite()">🔪 BEDAH WEB</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button>
                <button class="btn btn-secondary" id="btnDownload" onclick="downloadAll()" disabled>📦 Download All</button>
            </div>
            <div class="spinner" id="spinner"></div>
        </div>
        
        <div class="result" id="result">
            <div id="statusBadge"></div>
            <div class="tabs" id="tabs">
                <button class="tab active" onclick="switchTab('html')">HTML</button>
                <button class="tab" onclick="switchTab('endpoints')">Endpoints</button>
                <button class="tab" onclick="switchTab('keys')">API Keys</button>
                <button class="tab" onclick="switchTab('scripts')">Scripts</button>
                <button class="tab" onclick="switchTab('csslist')">CSS Files</button>
                <button class="tab" onclick="switchTab('csscontent')">CSS Content</button>
                <button class="tab" onclick="switchTab('jscontent')">JS Content</button>
                <button class="tab" onclick="switchTab('forms')">Forms</button>
                <button class="tab" onclick="switchTab('comments')">Comments</button>
                <button class="tab" onclick="switchTab('meta')">Meta</button>
            </div>
            <div id="tabContent" class="code-block"></div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        let currentTab = 'html';
        let assetCache = {};
        
        function ripSite() {
            const url = document.getElementById('targetUrl').value.trim();
            if (!url) return alert('Masukkan URL dulu!');
            
            const btn = document.getElementById('btnRip');
            const spinner = document.getElementById('spinner');
            const result = document.getElementById('result');
            const btnDownload = document.getElementById('btnDownload');
            
            btn.disabled = true;
            btnDownload.disabled = true;
            spinner.style.display = 'block';
            result.style.display = 'none';
            assetCache = {};
            
            fetch('/api/rip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            })
            .then(r => r.json())
            .then(data => {
                currentData = data;
                
                const badge = document.getElementById('statusBadge');
                if (data.success) {
                    badge.innerHTML = `<span class="status-badge s-ok">✅ ${data.status} | Bypass: ${data.bypass || 'none'} | Attempts: ${data.attempts}</span>`;
                    btnDownload.disabled = false;
                } else {
                    badge.innerHTML = `<span class="status-badge s-err">❌ GAGAL — ${data.error || 'Tidak bisa diakses'} (${data.attempts} attempts)</span>`;
                }
                
                document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === 0));
                currentTab = 'html';
                switchTab('html');
                result.style.display = 'block';
            })
            .catch(e => alert('Error: ' + e.message))
            .finally(() => {
                btn.disabled = false;
                spinner.style.display = 'none';
            });
        }
        
        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.remove('active');
                if (t.textContent.toLowerCase().replace(/ /g, '') === tab.toLowerCase().replace(/ /g, '')) {
                    t.classList.add('active');
                }
                if (tab === 'csslist' && t.textContent.toLowerCase().includes('css files')) t.classList.add('active');
                if (tab === 'csscontent' && t.textContent.toLowerCase().includes('css content')) t.classList.add('active');
                if (tab === 'jscontent' && t.textContent.toLowerCase().includes('js content')) t.classList.add('active');
            });
            
            const content = document.getElementById('tabContent');
            
            if (!currentData || !currentData.success) {
                content.innerHTML = '<span style="color: var(--red)">Tidak ada data.</span>';
                return;
            }
            
            const d = currentData.data;
            if (!d) {
                content.innerHTML = '<span style="color: var(--red)">Data kosong.</span>';
                return;
            }
            
            const r = d.ripped;
            
            switch(tab) {
                case 'html':
                    content.innerHTML = esc(d.html?.substring(0, 200000) || 'N/A');
                    break;
                case 'endpoints':
                    content.innerHTML = buildList(d.endpoints, 'Endpoints');
                    break;
                case 'keys':
                    content.innerHTML = buildList(d.apiKeys, 'API Keys', true);
                    break;
                case 'scripts':
                    const allScripts = [...(r?.scripts || []), ...(r?.inlineScripts?.map(s => '[INLINE] ' + s.substring(0, 100)) || [])];
                    content.innerHTML = buildList(allScripts, 'Scripts');
                    break;
                case 'csslist':
                    const allCSS = [...(r?.styles || []), ...(r?.inlineStyles?.map(s => '[INLINE] ' + s.substring(0, 100)) || [])];
                    content.innerHTML = buildList(allCSS, 'CSS Files');
                    break;
                case 'csscontent':
                    fetchAndShowAssets(r?.styles || [], 'CSS', content);
                    break;
                case 'jscontent':
                    fetchAndShowAssets(r?.scripts || [], 'JS', content);
                    break;
                case 'forms':
                    content.innerHTML = buildForms(r?.forms);
                    break;
                case 'comments':
                    content.innerHTML = buildList(r?.comments, 'HTML Comments');
                    break;
                case 'meta':
                    content.innerHTML = `
                        <div class="card-item"><div class="label">Title</div>${esc(r?.title || 'N/A')}</div>
                        ${(r?.meta || []).map(m => `<div class="card-item"><div class="label">${esc(m.name)}</div>${esc(m.content)}</div>`).join('')}
                    `;
                    break;
            }
        }
        
        function fetchAndShowAssets(files, type, contentEl) {
            if (!files || files.length === 0) {
                contentEl.innerHTML = `<div class="card-item">Tidak ada file ${type}.</div>`;
                return;
            }
            
            const cacheKey = type + '_content';
            if (assetCache[cacheKey]) {
                contentEl.innerHTML = assetCache[cacheKey];
                return;
            }
            
            contentEl.innerHTML = '<div class="spinner" style="display:block;margin:30px auto;"></div>';
            
            const cleanFiles = files.filter(f => f && typeof f === 'string' && !f.startsWith('data:') && !f.startsWith('#'));
            
            fetch('/api/download-assets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentData.url, files: cleanFiles })
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success || !data.results) {
                    contentEl.innerHTML = '<div class="card-item">Gagal download.</div>';
                    return;
                }
                
                let html = '';
                for (const [file, result] of Object.entries(data.results)) {
                    html += `<div class="card-item">
                        <div class="label">${result.success ? '✅' : '❌'} ${esc(file)} (${result.status})</div>`;
                    if (result.success && result.content) {
                        html += `<pre style="margin-top:8px;font-size:0.75em;max-height:300px;overflow:auto;background:rgba(0,0,0,0.5);padding:10px;border-radius:8px;">${esc(result.content.substring(0, 5000))}</pre>`;
                    }
                    html += '</div>';
                }
                
                assetCache[cacheKey] = html || '<div class="card-item">Tidak ada konten.</div>';
                contentEl.innerHTML = assetCache[cacheKey];
            })
            .catch(e => {
                contentEl.innerHTML = '<div class="card-item">Error: ' + esc(e.message) + '</div>';
            });
        }
        
        function downloadAll() {
            if (!currentData?.success) return alert('Bedah dulu web-nya!');
            
            const d = currentData.data;
            const r = d.ripped;
            const allFiles = [...(r?.scripts || []), ...(r?.styles || [])].filter(f => f && typeof f === 'string' && !f.startsWith('data:'));
            
            document.getElementById('btnDownload').disabled = true;
            document.getElementById('btnDownload').textContent = '⏳ Downloading...';
            
            fetch('/api/download-assets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentData.url, files: allFiles })
            })
            .then(r => r.json())
            .then(data => {
                let allContent = `╔══════════════════════════════════════╗\n`;
                allContent += `║  SITEGHOST RIP — ${currentData.url}\n`;
                allContent += `║  ${new Date().toISOString()}\n`;
                allContent += `╚══════════════════════════════════════╝\n\n`;
                allContent += `=== HTML SOURCE ===\n${d.html}\n\n`;
                
                if (data.results) {
                    for (const [file, result] of Object.entries(data.results)) {
                        if (result.success && result.content) {
                            allContent += `\n=== ${file} ===\n${result.content}\n`;
                        }
                    }
                }
                
                const blob = new Blob([allContent], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `siteghost_${currentData.url.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30)}.txt`;
                a.click();
                URL.revokeObjectURL(a.href);
            })
            .catch(e => alert('Error: ' + e.message))
            .finally(() => {
                document.getElementById('btnDownload').disabled = false;
                document.getElementById('btnDownload').textContent = '📦 Download All';
            });
        }
        
        function buildList(items, label, isDanger) {
            if (!items || items.length === 0) return `<div class="card-item">Tidak ada ${label.toLowerCase()}.</div>`;
            return items.map(item => {
                const cls = isDanger ? 'danger' : '';
                return `<div class="card-item${cls ? ' ' + cls : ''}">${esc(String(item).substring(0, 500))}</div>`;
            }).join('');
        }
        
        function buildForms(forms) {
            if (!forms || forms.length === 0) return '<div class="card-item">Tidak ada form.</div>';
            return forms.map(f => `
                <div class="card-item">
                    <div class="label">[${f.method}] ${esc(f.action)}</div>
                    Inputs: ${(f.inputs || []).map(i => i.name + ' (' + i.type + ')').join(', ') || 'N/A'}
                </div>
            `).join('');
        }
        
        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }
        
        function clearAll() {
            document.getElementById('targetUrl').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('btnDownload').disabled = true;
            currentData = null;
            assetCache = {};
        }
        
        document.getElementById('targetUrl').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ripSite();
        });
    </script>
</body>
</html>
